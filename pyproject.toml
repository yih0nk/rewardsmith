[project]
name = "rewardsmith"
version = "0.1.0"
description = "Type a behavior; an agent writes the reward, trains a simulated robot, watches the result and rewrites its own reward."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# GPU box only (Runpod). Install jax with CUDA separately: see scripts/runpod_setup.sh.
sim = [
    "playground",
    "mediapy",
    "pillow",
]
# Factory Droid as the reward editor (REWARDSMITH_EDITOR=droid). Needs the droid CLI on PATH.
droid = [
    "droid-sdk",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
rewardsmith-server = "rewardsmith.server:main"
rewardsmith-worker = "rewardsmith.orchestrator:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rewardsmith*"]

[tool.setuptools.package-data]
rewardsmith = ["export_files/*"]  # the README and script every policy export carries

[tool.pytest.ini_options]
testpaths = ["tests"]
